/**:
    ros__parameters:
      registration_method: "NDT_OMP"
      score_threshold: 2.0
      # Retuned 2026-08-11 from bag evidence, not from guesswork. Measured on
      # golfcart_test_01 / run01 / run_20260805_221838: /pcl_pose only really
      # updated at 4-6 Hz against a 10 Hz Ouster, sat FROZEN for 37-66% of each
      # run (gaps of 0.25-2.3 s), then jumped 0.6-1.7 m on recovery. /rosout
      # shows 1027 "fitness score is over 2.0" and ZERO "didn't converge" --
      # so NDT always converged, it just matched badly.
      #
      # Benchmarked one align() against this exact GlobalMap.pcd (5.84M pts):
      # the old leaf=1.0/res=2.0 left only ~2800 source points and cost ~3-20 ms
      # per scan out of a 100 ms budget. The coarse settings were buying speed
      # nothing needed. leaf=0.5 gives ~9300 points for ~25 ms align + ~15 ms
      # fitness, still well inside budget; leaf=0.3 (~23000 points) blew past it
      # at ~90-160 ms, so 0.5 is the ceiling worth taking.
      ndt_resolution: 1.0
      ndt_step_size: 0.1
      # 0 means omp_get_max_threads() in the component (line 418-421), i.e. 20
      # threads on this 20-core PC. Measured 2026-09-07: lidar_localization sat
      # at 535% CPU (5.3 cores) with load average ~10 while os_driver could only
      # deliver 6.5 Hz of a 10 Hz sensor -- NDT was starving the very driver that
      # feeds it. NDT_OMP scales sublinearly well before 20 threads anyway, so
      # capping at 6 costs little align time and leaves the UDP receive path,
      # the CAN nodes and RViz enough CPU to keep up.
      ndt_num_threads: 6
      # Normal scans converge in 3-4 iterations, so the extra headroom is only
      # ever spent when the initial guess is stale -- which is exactly the
      # freeze-and-jump case above.
      ndt_max_iterations: 30
      transform_epsilon: 0.01
      voxel_leaf_size: 0.5
      scan_max_range: 35.0
      scan_min_range: 1.5
      # Ouster runs 1024x10 => 0.1 s per revolution. The old 0.02 would have
      # scaled every per-point time offset by 5x if use_imu were ever turned on.
      scan_period: 0.1
      use_pcd_map: true
      map_path: "/home/myuser/2Localize_get_path/src/GlobalMap.pcd"
      set_initial_pose: true
      initial_pose_x: 0.0
      initial_pose_y: 0.0
      initial_pose_z: 0.0
      initial_pose_qx: 0.0
      initial_pose_qy: 0.0
      initial_pose_qz: 0.0
      initial_pose_qw: 1.0
      # use_odom needs odom_bridge (golfcart_low_level) actually running, or the
      # initial guess for each align() degrades to "the vehicle did not move".
      # None of the three bags above contain /odometry, so those runs had no
      # motion prior at all -- one dropped scan then leaves the next guess a
      # full scan period stale, which is how a single miss cascades into a
      # multi-second freeze.
      #
      # 2026-09-07: odom_bridge did not exist in THIS workspace at all (only in
      # 3Localize_Auto), so use_odom:=true here was silently a no-op. It applies
      # two measured corrections the raw CAN/IMU data needs -- an 11% speed
      # over-report and a 0.67 deg/s gyro bias. See its module docstring, and
      # re-measure with scripts/calibrate_odom.py.
      #
      # 2026-10-01: it went missing again when golfcart_low_level was rebuilt
      # from its July source, and this time it was worse than a no-op: with the
      # gate below holding a prior that never moves, good matches (fitness
      # 0.79) were rejected the moment the cart drove off and lock was lost
      # 17 m behind it. odom_bridge now lives in this package
      # (scripts/odom_bridge.py) and lidar_localization.launch.py starts it.
      # "Scan deskew skipped: the odom buffer does not cover this sweep" every
      # 5 s in the log means /odometry is not arriving.
      use_odom: true
      # Replay the odom motion between the scan timestamp and now onto the NDT
      # result before publishing it. align() answers "where was the vehicle
      # when this revolution started", which by the time it returns is one scan
      # period plus the registration time out of date; writing it back raw
      # dragged the published pose backwards by roughly v * latency on every
      # update. In the 2026-08-11 bags that shows up as 11-16% of published
      # poses stepping faster than 3 m/s, with single steps up to 0.86 m -- on
      # a cart whose real top speed is ~2.5 m/s. Turn off to get the old
      # retrospective behaviour back.
      use_scan_latency_compensation: true
      # Deskew each revolution with the odom twists before registering it.
      # The Ouster sweeps for a full scan_period, so the last point of a scan
      # is taken v * 0.1 s further along the road than the first: 0.20 m at
      # 2 m/s, 0.40 m at 4 m/s, and NDT is handed a cloud stretched along the
      # direction of travel. Measured in the 2026-09-09 bags, the disagreement
      # between an NDT step and wheel odom over the same interval runs 0.013
      # m/s parked, 0.31 m/s at 1.0-1.5 m/s and 0.36 m/s (p90 1.22) at
      # 1.5-2.0 m/s -- i.e. noise proportional to speed, on runs whose inlier
      # ratio sat flat at ~0.85 the whole time, so the map was never the
      # problem. Uses the per-point `t` field, which needs the Ouster driver
      # left on point_type: original (driver_params.yaml). Not the IMU: see
      # use_imu below for why that path is unusable here.
      use_scan_deskew: true
      # Take the initial guess at the scan's own timestamp instead of the
      # dead-reckoned present. align() is answering "where was the vehicle
      # when this revolution started", so starting it from the newer pose puts
      # the search ~v * latency from the answer (0.3 m at 2 m/s) and inflates
      # max_correction_distance below by the same amount -- with a 1.0 m gate
      # and ~0.15 s of latency that starts rejecting sound matches around
      # 4-5 m/s, even though the 2026-09-09 bags (max 2.68 m/s) show zero
      # rejections today. Bounded by max_latency_compensation_sec: a prior
      # older than that is not worth walking back.
      use_scan_time_init_guess: true
      # Ceiling on that replay. Beyond half a second the odom prior is not
      # trustworthy enough to extrapolate on, so the pose is published as of
      # scan time + 0.5 s rather than compounding further.
      max_latency_compensation_sec: 0.5
      # Outlier gate, in metres of correction applied in a single scan (0 to
      # disable). NDT converging confidently onto the wrong part of the map is
      # indistinguishable from a good match by fitness score alone, but it is
      # obvious geometrically: the cart cannot need a metre of correction after
      # 100 ms. Rejected scans hold the odom prediction instead, which is the
      # better pose. Corrections in normal driving sit around 3-5 cm (p99
      # ~0.37 m including the latency sawtooth this release removes), so 1.0 m
      # only catches genuine mismatches.
      max_correction_distance: 1.0
      # ... but never lock out relocalisation: after this many consecutive
      # rejections the vehicle is treated as genuinely displaced (pushed,
      # towed, or recovering from a long sensor dropout) and the correction is
      # accepted. At 10 Hz this is a one-second hold.
      max_correction_reject_streak: 10
      # Stays OFF deliberately. lidar_undistortion.hpp takes orientation from
      # the Imu message quaternion, and ouster-ros hardcodes that to identity
      # (os_ros.cpp:70-73, orientation_covariance = -1). Feeding it in would
      # deskew against a constant zero rotation and double-integrate raw
      # acceleration that still has gravity in it -- worse than no deskew.
      # Deskewing needs a real AHRS, or an IMU preintegration front end.
      use_imu: false
      # OFF again 2026-09-07 as the note below always intended. The debug block
      # cout's a 4x4 matrix plus five lines per scan from inside the same
      # single-threaded executor that runs align(), so it was taxing the loop it
      # was meant to measure.
      #
      # (Kept for context: it was turned ON so a run would print per-scan align
      # time + fitness -- the one number the bag analysis could not get, since
      # the benchmark below ran on a 20-core dev box and proves the parameters
      # are affordable there, not that the vehicle PC keeps up.)
      enable_debug: false
      enable_map_odom_tf: false
      global_frame_id: map
      odom_frame_id: odom
      base_frame_id: base_link
      enable_timer_publishing: true
      # Was 30.0. timerPublishPose() re-stamps the LAST NDT pose with now() and
      # publishes it, so a 30 Hz timer against a ~5 Hz NDT was manufacturing
      # ~25 fresh-looking poses/s that carried no new information: /pcl_pose
      # measured 18 Hz while 34.7% of logged rows held a position identical to
      # the previous one. Downstream (pagard, logcsv) cannot tell those apart
      # from real updates. 10.0 still covers the sensor rate without inventing
      # updates NDT never produced.
      pose_publish_frequency: 10.0
      # Was 2000. The whole Path is copied and published on every timer tick AND
      # again inside cloudReceived, on the same thread as align(). 2000 poses is
      # ~110 KB per publish; at the old 30 Hz that is ~3 MB/s of serialisation
      # stealing time from registration. 200 poses still gives RViz a visible
      # trail (20 s at 10 Hz).
      path_max_length: 200
      # GNSS recovery: re-anchors x/y from an RTK fix once NDT has been
      # failing (fitness_score > score_threshold) for gnss_lost_scan_threshold
      # scans in a row. gnss_origin_lat/lon must be calibrated for THIS map
      # (the lat/lon that corresponds to this map's x=0,y=0) or recovery stays
      # disabled; gnss_to_map_yaw_offset_deg is the rotation from ENU
      # (0=East-aligned x) to this map's x-axis.
      # Calibrated 2026-07-23 from Documents/Zoo_waypoint_2m and _2.5m
      # path_data.csv (475/590 paired NDT-vs-GNSS samples, fit RMS ~1.6m --
      # consistent with this receiver's standard-GPS accuracy, NOT RTK, since
      # the onboard NEO-M9N doesn't support RTK at all). Good enough for a
      # coarse few-meter recovery reference, not precise correction.
      use_gnss_recovery: false
      gnss_topic: "/ublox_gps_node/fix"
      gnss_origin_lat: 14.85311510
      gnss_origin_lon: 102.08213603
      gnss_to_map_yaw_offset_deg: 178.381
      gnss_max_covariance: 25.0
      gnss_max_age_sec: 1.0
      gnss_lost_scan_threshold: 30
