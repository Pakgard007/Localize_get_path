# ตำแหน่งของแต่ละแผนที่ PCD บนโลก: จุด map = R(yaw_deg) * ENU + (tx, ty)
# ENU = เมตรไปทางตะวันออก/เหนือ จาก enu_origin (WGS84) — ใช้แปลง lat/lon ของเว็บ ModRide
# มาเป็นพิกัด map ของ RViz ชื่อ key = ชื่อไฟล์ PCD ไม่มี .pcd
#
# FullGlobalMap (2026-11-10, แผนที่ที่ใช้อยู่ เกือบทั้งมหาวิทยาลัย): ผนังของ Loop1 ทับผนังของแผนที่นี้
#   (ICP 2D, 88% ของผนังห่างไม่เกิน 0.3 m) ต่อจาก Loop1 แล้วปรับกับขอบตึก OSM ทั้งมหาวิทยาลัย
#   (หมุน 0.01 deg เลื่อน 0.36 m) ตึก 24 หลังที่ขอบทับผนังต้องเลื่อนอีกค่ากลาง 0.57 m
# GlobalMapLoop1 (2026-11-05, แผนที่เก่า src/old_maps): fix RTK (/ublox_gps_node/fix, เสาอยู่หลัง
#   base_link 1.03 m) เทียบ /pcl_pose ใน bag 6 ไฟล์ของ 2026-10-21 (10,673 คู่, RMS 0.42 m) แล้วปรับ
#   ให้ขอบตึก OSM ทับผนังใน PCD (เลื่อน 0.7 m หมุน 0.18 deg) ขอบห่างผนังค่ากลาง 0.44 m
# GlobalMapLoop2 (แผนที่เก่า src/old_maps): แก้ 2026-11-10 ผ่าน FullGlobalMap (ผนัง Loop2 ทับแผนที่
#   ใหม่ 81% ภายใน 0.3 m) ค่าเดิมของ 2026-11-05 (yaw -93.6614, t 190.684, 5.533) จับคู่ผนังกับ Loop1
#   ที่ซ้อนกันน้อยแล้วได้คำตอบผิด วางแผนที่คลาดไปราว 120 m
