# ขนาดรถกอล์ฟที่ใช้วาดโมเดลใน RViz (หน่วยเมตร)
#
# แก้ไฟล์นี้แล้วต้องสร้างโมเดลใหม่ (ปิดขั้นที่ 2 localization ก่อน):
#   cd ~/2Localize_get_path
#   python3 src/lidar_localization_ros2-main/urdf/cart_model.py
#   colcon build --packages-select lidar_localization_ros2
# แล้วเปิดขั้นที่ 2 ใหม่ (robot_state_publisher ในนั้นเป็นตัวส่งโมเดลให้ RViz)
#
# ที่มาของตัวเลข (ชุดเดียวกับ ~/1Mapping/src/mapping_rviz_panel/cart/cart.yaml):
#   [วัด]    วัดจากรถจริง หรือคำนวณจากแผนที่ที่เก็บเมื่อ 2026-10-07 (1212 keyframe, 1 กม.)
#   [ทีม]    ค่าที่ใช้อยู่แล้วใน golfcart_low_level (cart_marker.py)
#   [ทั่วไป] ขนาดรถกอล์ฟทั่วไป ยังไม่ได้วัดกับคันนี้ — วัดแล้วมาแก้ได้

wheelbase: 1.65          # [วัด] ระยะเพลาหน้า-หลัง (wheelbase_m ใน golfcart_low_level.yaml)
length: 2.8              # [ทีม] ยาวสุดกันชนหน้าถึงที่พักเท้าหลัง
width: 1.3               # [ทีม] กว้างสุดขอบยางซ้าย-ขวา
front_overhang: 0.40     # [ทั่วไป] เพลาหน้าถึงปลายกันชนหน้า
tire_diameter: 0.457     # [ทั่วไป] ยาง 18x8.5-8
tire_width: 0.216
roof_length: 2.05        # [ทั่วไป]
roof_front: 1.42         # [ทั่วไป] ขอบหน้าหลังคา วัดจากเพลาหลังไปข้างหน้า

# ตำแหน่ง lidar บนรถ ถ้าผิด ล้อจะลอยหรือจมพื้น หรือรถจะเลื่อนหน้า-หลังจากตำแหน่งจริง
lidar:
  ahead_of_rear_axle: 1.53   # [วัด] ฝั่ง mapping: จากการเลี้ยว 122 ช่วง (ส่ายข้าง = อัตราเลี้ยว x ระยะนี้)
                             #       คลาดเคลื่อน ~0.04 | log cbf_qp ฝั่งนี้ (10 รอบ) ให้ค่าต่ำกว่า ~0.2
                             #       ถ้าวัดด้วยตลับเมตรได้ ใช้ค่าที่วัด
  height: 1.80               # [วัด] สูงจากพื้น เทียบกับพื้นในแผนที่รอบ 202 keyframe

# เสาเสาอากาศ RTK (u-blox ZED-F9R) ในโมเดลมีสองเฟรม:
#   rtk_pole_base = ฐานเสา, gps = ปลายเสาที่เสาอากาศ (/ublox_gps_node/fix ส่งมาในเฟรมนี้)
# วัดจากพื้นใต้กึ่งกลางเพลาหลัง ไม่ใส่หัวข้อนี้ = ไม่มีเสาในโมเดล
rtk:
  ahead_of_rear_axle: 0.0    # [ผู้ใช้] เสาอยู่ตรงล้อหลัง (บอกเมื่อ 2026-10-21)
  left_of_center: 0.0        # [ประมาณ] + = ไปทางซ้ายรถ ยังไม่ได้วัด
  base_height: 1.756         # [ประมาณ] ฐานเสาสูงจากพื้น (ตอนนี้ = บนหลังคา) ยังไม่ได้วัด
  pole_length: 0.30          # [ประมาณ] ฐานเสาถึงเสาอากาศ ยังไม่ได้วัด

# base_link = เฟรมที่ localization ขยับ โมเดลแขวนอยู่กับเฟรมนี้
base_link:
  behind_lidar: 0.5          # ต้องตรงกับ --x ของ lidar_tf ใน lidar_localization.launch.py
  roll_deg: -0.8             # [วัด] base_link เอียงตามฐาน lidar ใช้ตั้งรถให้ขนานพื้น (ค่าของ lidar_link
  pitch_deg: 1.5             #       ฝั่ง mapping กลับเครื่องหมาย เพราะ base_link หันไปหน้ารถ)

# สีของชิ้นส่วน (r, g, b ช่วง 0-1) ไม่ใส่ = สีตั้งต้นใน cart_model.py
# ชิ้นส่วนที่เปลี่ยนได้: body, roof, seat, trim, tire, metal, lamp, tail
# colors:
#   body: [0.95, 0.96, 0.97]
