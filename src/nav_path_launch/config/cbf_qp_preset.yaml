# "preset ค่าเริ่มต้น" ของสไลด์ CBF-QP Tuning Lab — ใช้กับ cbf_qp_node.py
# cbf_qp.launch.py อ่านไฟล์นี้จาก src ตรง ๆ แก้แล้วมีผลตอน launch รอบถัดไป ไม่ต้อง build
# ปรับตอนรันอยู่ (ไม่ถูกบันทึกกลับมาที่ไฟล์นี้ — ถ้าจะเก็บค่าไว้ใช้รอบหน้า ต้องมาแก้ที่นี่):
#   สไลเดอร์:  ros2 launch nav_path_launch cbf_qp.launch.py tune:=true
#   คำสั่ง:    ros2 param set /cbf_qp_solver <ชื่อ> <ค่า>
/**:
  ros__parameters:
    # ---- สวิตช์ของการทดลอง (ติ๊กเปิด/ปิดได้ในหน้าต่างสไลเดอร์ระหว่างรถวิ่ง)
    use_h1: true             # false = ไม่ใช้กรอบเส้นทาง h₁ ตัดสิน (ยังคำนวณไว้ดูใน log)
    use_h2: true             # false = ไม่ใช้เพดานแรงเหวี่ยง h₂ ตัดสิน
    pure_pursuit_only: false # true = ไม่มี QP: L_d = fixed_ld คงที่, v = v_des จากไฟล์เส้นทาง
                             #        และ pagard เลี้ยวด้วย δ = atan(2L·sinα / L_d) ล้วน
    fixed_ld: 4.0            # L_d (m) ของโหมด pure_pursuit_only (1–12)

    # ---- น้ำหนักของ J = w_v(v − v_des)² + w_Ld(L_d − L_d,ref^eff)²  (สไลด์ 9)
    w_v: 1.0
    w_ld: 0.30

    # ---- h₁ กรอบเส้นทาง (สไลด์ 10–16) — α₁ = v/e_max คำนวณเอง ไม่มีให้ตั้ง
    e_max: 0.60          # ครึ่งความกว้างกรอบ (m)

    # ---- h₂ แรงเหวี่ยงด้านข้าง (สไลด์ 17–19)
    ay_max: 0.40         # m/s² — ต่ำ = เข้าโค้งช้าลง และยืด L_d,ref ด้วย √(0.4/a_y,max)
    alpha2: 0.4          # ระยะมองโค้งล่วงหน้า = max(L_d, v/α₂); ต่ำ = มองไกล ชะลอก่อนถึงโค้ง
                         # (สไลด์ไม่ได้ระบุค่า preset — ใช้ค่าเดิมของ adaptive_ld_node/pagard)
    curve_decel: 0.5     # h₂ᶜ (เพิ่มจากสไลด์): ชะลอได้ b m/s² ก่อนถึงโค้ง
                         # v² ≤ a_y,max/|κ(s)| + 2·b·s ทุกระยะ s ข้างหน้า; สูง = ชะลอช้าแต่แรงกว่า
                         # ความเร็วจากไฟล์ (ค่าตั้งต้น) + use_h2 เปิด = ชะลอจริง, ปิด = ความเร็วจากไฟล์ล้วน

    # ---- L_d,ref = L_d,min + τ·v แล้วหารด้วย (1 + k_adapt·κ)  (สไลด์ 20–22)
    tau: 0.70            # time headway (s)
    k_adapt: 3.0         # เกนไวต่อโค้ง; 0 = ปิด
    ld_min: 2.0          # L_d,min (m)
    ld_max: 8.0          # L_d,max (m)

    # ---- กริดของ Grid Search (สไลด์ 25)
    v_min: 0.0
    v_max: 3.8
    v_step: 0.05
    ld_step: 0.1

    # ---- ค่าคงที่ของรถ
    wheelbase: 1.57
    max_steer_rad: 0.8

    # ---- ส่วนที่เพิ่มจากสไลด์
    recovery_v_max: 1.0  # เพดาน v* ตอน QP infeasible (m/s); ตั้ง >= v_max เพื่อปิด
    v_des: 2.0           # ใช้เมื่อ /desired_speed จาก pagard ไม่มา/ไม่สด
